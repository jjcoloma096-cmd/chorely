<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chorely</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--tx:#eef0f4;--mut:#8a91a0;--ac:#7c5cff;--ok:#2fd08a;--wa:#f5a524;--bd:#262a33}
body.light{--bg:#f4f5f9;--card:#fff;--tx:#14161b;--mut:#6b7280;--bd:#e2e4ec}
*{box-sizing:border-box;margin:0;font-family:system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);padding:env(safe-area-inset-top) 0 150px}
header{position:sticky;top:0;z-index:8;background:var(--bg);padding:18px 16px 6px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:24px}
.row{display:flex;gap:8px;overflow-x:auto;padding:6px 16px;scrollbar-width:none}
.mo{display:flex;align-items:center;justify-content:space-between;padding:4px 16px}.mo b{font-size:17px}
.day{flex:0 0 52px;text-align:center;padding:8px 0;border-radius:14px;background:var(--card);border:1px solid var(--bd);color:var(--mut);font-size:12px}
.day b{display:block;font-size:18px;color:var(--tx)}.day.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.dot{display:block;height:6px;width:6px;border-radius:3px;margin:3px auto 0}.dot.p{background:var(--ac)}.dot.d{background:var(--ok)}.on .dot.p{background:#fff}
.chip{flex:0 0 auto;padding:7px 14px;border-radius:20px;background:var(--card);border:1px solid var(--bd);color:var(--mut);font-size:14px}.chip.on{background:var(--tx);color:var(--bg)}
.card{margin:10px 16px;padding:12px;background:var(--card);border:1px solid var(--bd);border-radius:18px}
.top{display:flex;gap:12px;align-items:center}.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:0 0 auto;color:#fff}
.m{flex:1;min-width:0}.m small,.note,.ct{display:block;color:var(--mut);font-size:12px;margin-top:3px}.ct{margin:0 0 2px}.note{text-align:center;margin:16px}
.pics{display:flex;gap:10px;margin-top:10px}figure{flex:1;text-align:center}figcaption{font-size:11px;color:var(--mut);margin-top:3px}
.th{width:100%;height:110px;border-radius:12px;object-fit:cover;background:var(--bd)}
button{border:0;border-radius:12px;padding:10px 14px;background:var(--ac);color:#fff;font-weight:600;font-size:14px}

.sm{margin-top:8px;font-size:12px;padding:7px 10px}
.seg{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.seg button{padding:6px 11px;font-size:12px;background:var(--bg);color:var(--mut);border:1px solid var(--bd)}
.seg .on.later{background:var(--wa);color:#000}.seg .on.pending{background:var(--ac);color:#fff}.seg .on.done{background:var(--ok);color:#000}
.tag{display:inline-block;margin-top:8px;padding:4px 10px;border-radius:10px;font-size:12px;font-weight:600;color:#fff}.tag.later{background:var(--wa);color:#000}.tag.pending{background:var(--ac)}.tag.done{background:var(--ok);color:#000}

.rk{width:36px;font-size:22px;text-align:center}.cnt{font-size:22px}
.set{margin:10px 16px;padding:14px;background:var(--card);border:1px solid var(--bd);border-radius:18px}.set h3{font-size:15px;margin-bottom:4px}.set small{color:var(--mut)}.set button{margin-top:8px;margin-right:6px}

#nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:4}

input{width:100%;padding:13px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px;margin-top:10px}

.pk{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.pk button{background:var(--card);color:var(--tx);border:1px solid var(--bd);font-weight:500}.pk .on{background:var(--ac);color:#fff;border-color:var(--ac)}

/* CHAT */
.msg-row{display:flex;align-items:flex-end;gap:8px;margin:12px 0}.msg-row.me{justify-content:flex-end}
.msg-col{display:flex;flex-direction:column;max-width:80%;min-width:0}.msg-row.me .msg-col{align-items:flex-end}
.msg-name{font-size:12px;font-weight:800;color:var(--tx);margin:0 0 3px 4px}

.msg-receipt{font-size:11px;color:var(--mut);margin-top:4px;padding-top:4px;border-top:1px solid #ffffff22}
.earn-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.earn-chk{width:20px;height:20px;margin:0;accent-color:var(--ac);cursor:pointer;flex:0 0 auto}
.mention-popup{position:fixed;bottom:calc(120px + env(safe-area-inset-bottom));left:16px;right:16px;background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:0 8px 24px #0008;z-index:16;max-height:200px;overflow-y:auto;display:none}
.mention-popup.show{display:block}
.mention-item{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--bd)}
.msg-col{position:relative}.bub-wrap{position:relative;display:inline-block;max-width:100%}
.react-row{position:absolute;bottom:calc(100% + 6px);left:0;z-index:15;display:flex;align-items:center;gap:4px;background:#262930;border:1px solid #3a3f4b;border-radius:999px;padding:6px 10px;box-shadow:0 8px 24px #000a;user-select:none}
.msg-row.me .react-row{left:auto;right:0}
.react-em{background:none;border:0;padding:2px 4px;font-size:24px;line-height:1;cursor:pointer;border-radius:50%;margin:0}
.react-em.picked{background:#ffffff22;box-shadow:0 0 0 2px var(--ac)}
.react-plus{width:32px;height:32px;border-radius:50%;background:#3a3e47;color:#eef0f4;border:0;padding:0;font-size:20px;font-weight:700;display:grid;place-items:center;cursor:pointer;margin:0 0 0 2px;flex:0 0 auto}
.react-pill{position:relative;display:inline-flex;align-items:center;gap:3px;background:#242730;border:2px solid var(--bg);border-radius:999px;padding:2px 7px;font-size:13px;line-height:1.2;margin-top:-8px;margin-left:auto;margin-right:6px;z-index:2;cursor:pointer;box-shadow:0 2px 6px #0005;color:var(--tx);font-weight:700;float:right}
.react-pill span.cnt-r{font-size:11px;color:var(--mut);margin-left:1px}
.emoji-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}
.emoji-grid button{background:var(--card);border:1px solid var(--bd);font-size:24px;padding:8px 0;border-radius:12px;margin:0}
.pp{flex:0 0 auto;text-align:center;font-size:11px;color:var(--mut)}.pp .aw{margin:0 auto 4px}.aw{position:relative;flex:0 0 auto}.pd{position:absolute;right:0;bottom:0;width:12px;height:12px;border-radius:50%;border:2px solid var(--card);background:#8a91a0}.pd.on{background:#2fd08a}
.warn{margin:8px 16px;padding:12px;border-radius:14px;background:#e5484d22;border:1px solid #e5484d;font-size:14px}
.st{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.st div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;text-align:center;font-size:12px;color:var(--mut)}.st b{display:block;font-size:20px;color:var(--tx)}
.chk{width:30px;height:30px;border-radius:8px;border:2px solid var(--bd);background:var(--bg);color:#000;padding:0;font-size:18px;flex:0 0 auto}.chk.on{background:var(--ok);border-color:var(--ok)}
.toast{position:fixed;top:calc(60px + env(safe-area-inset-top));left:12px;right:12px;z-index:9;background:var(--tx);color:var(--bg);padding:12px;border-radius:14px;font-size:14px}.nf{padding:10px 0;border-bottom:1px solid var(--bd);font-size:14px}.nf.un{font-weight:700}
#call{position:fixed;inset:0;background:#000e;z-index:20;display:none;align-items:center;justify-content:center;flex-direction:column;color:#fff;text-align:center;gap:16px;padding:20px}#call.show{display:flex}
.login{max-width:380px;margin:10vh auto;padding:20px}.empty{text-align:center;color:var(--mut);padding:40px}#err{color:#ff6b6b;margin-top:8px;font-size:14px}#big{width:100%;border-radius:16px}
#mapBox{height:min(62vh,480px);width:100%;border-radius:14px;overflow:hidden;background:var(--bd);margin-top:10px;z-index:0}
.loc-marker{width:44px;height:44px;border-radius:50%;border:3px solid #7c5cff;box-shadow:0 2px 10px #0008;overflow:hidden;background:#333;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:16px}
.loc-marker img{width:100%;height:100%;object-fit:cover}.loc-marker.me{border-color:#2fd08a}.loc-pin{display:inline-block;margin-left:2px;font-size:12px}
/* ===== NEW: TYPING INDICATOR ===== */
.typing-row{display:flex;align-items:flex-end;gap:8px;margin:12px 0}
.typing-label{font-size:12px;font-weight:700;color:var(--mut);margin:0 0 3px 4px}
.typing-bub{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;display:inline-flex;align-items:center;gap:5px}
.typing-bub i{width:7px;height:7px;border-radius:50%;background:var(--mut);display:block;animation:tb 1.2s infinite}
.typing-bub i:nth-child(2){animation-delay:.15s}.typing-bub i:nth-child(3){animation-delay:.3s}
@keyframes tb{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
.ai-badge{font-size:11px;background:var(--ac);color:#fff;padding:2px 7px;border-radius:999px;font-weight:700;margin-left:6px}

/* ===== V2: Before/After slider, pinned, search, typing-human ===== */
.ba-preview{display:flex;gap:8px;margin-top:10px;cursor:pointer}
.ba-preview figure{flex:1;margin:0;position:relative}
.ba-preview img{width:100%;height:110px;object-fit:cover;border-radius:10px;display:block}
.ba-preview figcaption{position:absolute;top:6px;left:6px;background:#000a;color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px}
.ba-cta{margin-top:8px;width:100%;padding:10px;border-radius:10px;background:var(--ac);color:#fff;font-weight:700;border:0;cursor:pointer}
.cmp-backdrop{position:fixed;inset:0;background:#000c;z-index:90;display:none;align-items:flex-end;justify-content:center}
.cmp-backdrop.open{display:flex}
.cmp-box{background:var(--bg);width:100%;max-width:640px;max-height:92vh;border-radius:18px 18px 0 0;overflow:hidden;display:flex;flex-direction:column}
.cmp-head{padding:14px 16px 6px;font-weight:800;font-size:16px}
.cmp-sub{padding:0 16px 10px;color:var(--mut);font-size:12px}
.cmp-wrap{position:relative;width:100%;aspect-ratio:4/3;background:#000;overflow:hidden;touch-action:none;user-select:none;cursor:ew-resize}
.cmp-wrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}
.cmp-after{clip-path:inset(0 0 0 50%)}
.cmp-handle{position:absolute;top:0;bottom:0;left:50%;width:3px;background:#fff;box-shadow:0 0 0 1px #0005;z-index:2}
.cmp-knob{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:40px;height:40px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;font-size:18px;font-weight:800;z-index:3}
.cmp-lab{position:absolute;top:8px;padding:3px 8px;border-radius:999px;background:#000a;color:#fff;font-size:11px;font-weight:700;z-index:2}
.cmp-foot{padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.cmp-close{width:100%;padding:12px;border-radius:10px;background:var(--ac);color:#fff;font-weight:700;border:0;font-size:15px}
/* V6: voice, polls, stickers, scheduling */
.voice-audio{width:100%;max-width:260px;margin-top:6px}
.sticker-big{font-size:52px;line-height:1.2;text-align:center;background:transparent}
.sticker-tray{position:fixed;left:12px;right:12px;bottom:calc(132px + env(safe-area-inset-bottom));z-index:30;display:flex;flex-wrap:wrap;gap:8px;padding:10px;background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.35);max-height:220px;overflow-y:auto}
.sticker-tray button{font-size:30px;padding:8px 10px;background:transparent;border:none}
.options-tray{position:fixed;left:12px;right:12px;bottom:calc(132px + env(safe-area-inset-bottom));z-index:30;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px;background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.options-tray button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;background:var(--bg);border:1px solid var(--bd);border-radius:12px;font-size:11px;line-height:1.2}
.options-tray button b{font-size:22px}
.sticker-big{font-size:52px;line-height:1.2;text-align:center;background:transparent}
.bub.sticker-bub{background:transparent !important;border:none !important;box-shadow:none !important;padding:2px 0}
.bub.sticker-bub small,.bub.sticker-bub div a{opacity:.85}
.msg-input-wrap{position:relative;flex:1;min-width:0}
.msg-input-wrap input{width:100%;padding-right:38px;margin-top:0}
.search-btn-inside{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:transparent;border:none;font-size:18px;padding:6px;cursor:pointer}
.chat-search{display:flex;gap:6px;align-items:center;padding:6px 16px;background:var(--bg)}
.sys-msg{text-align:center;margin:12px 0}
.sys-msg span{display:inline-block;background:var(--card);border:1px solid var(--bd);color:var(--mut);font-size:12px;padding:6px 12px;border-radius:999px}

.poll-card{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-top:6px}
.poll-q{font-weight:800;margin-bottom:8px}
.poll-opt{display:block;width:100%;text-align:left;padding:8px 10px;margin:4px 0;background:var(--card);border:1px solid var(--bd);border-radius:10px;position:relative;overflow:hidden;cursor:pointer}
.poll-opt.voted{border-color:var(--ac);font-weight:700}
.poll-fill{position:absolute;inset:0;background:var(--ac);opacity:.18}
.poll-opt span{position:relative;z-index:1}
.poll-meta{font-size:11px;color:var(--mut);margin-top:6px}
.hold-btn{touch-action:none;user-select:none}
.voice-rec{position:fixed;left:12px;right:12px;bottom:calc(130px + env(safe-area-inset-bottom));background:#e5484d;color:#fff;padding:12px 14px;border-radius:12px;z-index:20;display:none;align-items:center;gap:10px;font-weight:700}
.voice-rec.show{display:flex}
.sched-tag{display:inline-block;margin-top:6px;padding:3px 8px;border-radius:999px;background:#7c5cff22;border:1px solid var(--ac);font-size:11px;font-weight:700}
.reply-photo-thumb{width:44px;height:44px;object-fit:cover;border-radius:8px}

.ba-wrap{position:relative;width:100%;height:180px;border-radius:12px;overflow:hidden;background:var(--bd);margin-top:10px;touch-action:none;user-select:none}
.ba-wrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.ba-after{clip-path:inset(0 0 0 50%)}
.ba-handle{position:absolute;top:0;bottom:0;left:50%;width:3px;background:#fff;box-shadow:0 0 0 1px #0005;z-index:2}
.ba-knob{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:36px;height:36px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;font-size:16px;font-weight:800;box-shadow:0 4px 14px #0008;z-index:3;cursor:ew-resize}
.ba-lab{position:absolute;top:8px;padding:3px 8px;border-radius:999px;background:#000a;color:#fff;font-size:11px;font-weight:700;z-index:2}
.ba-lab.l{left:8px}.ba-lab.r{right:8px}
.pinned-bar{background:#7c5cff22;border:1px solid var(--ac);border-radius:12px;padding:8px 10px;margin:0 0 10px;font-size:13px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.pinned-bar b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-search{position:sticky;top:54px;z-index:5;background:var(--bg);padding:6px 0}
.chat-search input{margin:0}
.search-hit{background:#7c5cff33;border-radius:4px;padding:0 2px}
.online-dot{width:9px;height:9px;border-radius:50%;background:#2fd08a;display:inline-block;margin-right:4px;box-shadow:0 0 0 2px var(--bg)}
.human-typing{font-size:12px;color:var(--mut);font-weight:600}

/* V2 FIX: keep photos inside bubble */
.bub-wrap{max-width:100%}
.bub{overflow:hidden;word-break:break-word}
.bub .pics{max-width:280px}
.bub .pics figure{flex:1 1 0;min-width:0}
.bub .th{width:100%;height:110px;max-width:280px;display:block}
.msg-col{min-width:0}

function parseMsgBody(raw){let s=String(raw||'');if(s.trimStart().startsWith('[[system:')){const _e=s.indexOf(']]');if(_e!==-1){return {reply:null,text:'',reacts:{},isAi:false,poll:null,sticker:null,voice:null,system:s.slice(9,_e)};}}let _isAi=false;if(s.startsWith('[[ai]]')||s.trimStart().startsWith('[[ai]]')){_isAi=true;s=s.trimStart().slice(6).replace(/^\s*/,'');while(s.startsWith('[[reply:')){const _end=s.indexOf(']]');if(_end===-1){s='';break;}s=s.slice(_end+2).replace(/^\s*/,'');}while(s.startsWith('[[ai]]')){s=s.slice(6).replace(/^\s*/,'');}if(s.startsWith('[[ ')||s==='[['){s=s.replace(/^\[\[\s*/,'');if(s.startsWith(']]'))s=s.slice(2).replace(/^\s*/,'');}if(s.startsWith('[[')&&s.indexOf(']]')!==-1&&s.indexOf(']]')<120&&/^\[\[[^\]]*\]\]/.test(s)&&!s.startsWith('[[poll:')&&!s.startsWith('[[sticker:')&&!s.startsWith('[[voice:')&&!s.startsWith('[[reacts:')){const _e=s.indexOf(']]');s=s.slice(_e+2).replace(/^\s*/,'');}}

  // Poll: [[poll:{json}]]
  if(s.trimStart().startsWith('[[poll:')){const _st=s.trimStart();const _end=_st.indexOf(']]');if(_end!==-1){try{const poll=JSON.parse(_st.slice(7,_end));return {reply:null,text:'',reacts,isAi:_isAi,poll,sticker:null,voice:null,system:null};}catch{}}}
  const m=s.match(REPLY_RE);let reply=null, rest=s;
  if(m){reply={id:m[1],sender:m[2],snippet:m[3]};rest=m[4];}

  let sticker=null, voice=null, text=rest;
  const _t=String(rest||'').trimStart();
  if(_t.startsWith('[[sticker:')){const _e=_t.indexOf(']]');if(_e!==-1){sticker=_t.slice(10,_e);text=_t.slice(_e+2).replace(/^\s*/,'');}}

function maybeCreateReminderFromAI(q){
  const m=q.match(/remind me to (.+?)( tomorrow| later| tonight| today|$)/i);
  if(!m) return null;
  const what=m[1].trim(); const when=(m[2]||'').trim()||'later';
  const rem={id:'rem_'+Date.now(), text:what, when, created:new Date().toISOString(), done:false};
  const arr=JSON.parse(localStorage.getItem('chorely_reminders')||'[]'); arr.push(rem); localStorage.setItem('chorely_reminders',JSON.stringify(arr));
  setTimeout(()=>{ toast('⏰ Reminder: '+what); }, 500);
  return rem;
}

function mkPc(f){if(pcs[f])return pcs[f];const pc=new RTCPeerConnection({iceServers:ICE});pcs[f]=pc;makingOffer[f]=false;ignoreOffer[f]=false;icePend[f]=[];call.stream.getAudioTracks().forEach(t=>pc.addTrack(t,call.stream));pc.onicecandidate=e=>{if(e.candidate)sig(f,'ice',e.candidate.toJSON())};pc.ontrack=e=>{const stream=e.streams&&e.streams[0]||new MediaStream([e.track]);ensureRemoteTile(f,stream)};pc.onnegotiationneeded=async()=>{try{makingOffer[f]=true;await pc.setLocalDescription();sig(f,'offer',pc.localDescription.toJSON())}catch(e){}finally{makingOffer[f]=false}};pc.onconnectionstatechange=()=>{if(pc.connectionState==='failed'){pc.restartIce()}};return pc}
async function flushIce(f){const pc=pcs[f];if(!pc||!pc.remoteDescription)return;for(const c of icePend[f]||[])await pc.addIceCandidate(c).catch(()=>{});icePend[f]=[]}
async function onSignal(r){if(!call||r.call_id!=call.id||r.from_user==S.id)return;const f=r.from_user;try{if(r.kind==='join'){if(!call.peers.includes(f))call.peers.push(f);mkPc(f);callUI()}else if(r.kind==='offer'){const pc=mkPc(f),polite=String(S.id)>String(f),collision=makingOffer[f]||pc.signalingState!=='stable';ignoreOffer[f]=!polite&&collision;if(ignoreOffer[f])return;if(collision&&polite)await pc.setLocalDescription({type:'rollback'});await pc.setRemoteDescription(r.data);await flushIce(f);await pc.setLocalDescription();sig(f,'answer',pc.localDescription.toJSON())}else if(r.kind==='answer'){const pc=pcs[f];if(pc){await pc.setRemoteDescription(r.data);await flushIce(f)}}else if(r.kind==='ice'){const pc=pcs[f];if(pc&&pc.remoteDescription)await pc.addIceCandidate(r.data).catch(()=>{});else(icePend[f]=icePend[f]||[]).push(r.data)}else if(r.kind==='leave'){closePc(f);call.peers=call.peers.filter(x=>x!==f);callUI()}else if(r.kind==='decline'){toast(nmOf(f)+' declined the call')}}catch(e){}}
async function toggleCamera(){if(!call)return;try{if(!call.camera){let v;try{v=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:call.cameraFacing||'user'}},audio:false})}catch{v=await navigator.mediaDevices.getUserMedia({video:true,audio:false})}const track=v.getVideoTracks()[0];call.stream.addTrack(track);call.cameraStream=v;call.camera=true;call.cameraSwitchAvailable=true;Object.keys(pcs).forEach(f=>{const pc=pcs[f];const sender=pc.getSenders().find(x=>x.track&&x.track.kind==='video');if(sender)sender.replaceTrack(track);else pc.addTrack(track,call.stream)})}else{call.stream.getVideoTracks().forEach(t=>{call.stream.removeTrack(t);t.stop()});Object.keys(pcs).forEach(f=>{const pc=pcs[f];const sender=pc.getSenders().find(x=>x.track&&x.track.kind==='video');if(sender)sender.replaceTrack(null)});call.cameraStream&&call.cameraStream.getTracks().forEach(t=>t.stop());call.camera=false}callUI()}catch{alert('Camera permission was not granted.')}} 
function muteCall(){call.muted=!call.muted;call.stream.getAudioTracks().forEach(t=>t.enabled=!call.muted);callUI()}
async function endCall(){if(!call)return;const c=call;call=null;clearInterval(callTimer);callTimer=null;Object.keys(pcs).forEach(closePc);c.stream.getTracks().forEach(t=>t.stop());c.cameraStream&&c.cameraStream.getTracks().forEach(t=>t.stop());await rpc('leave_call',{p_call_id:c.id}).catch(()=>{});c.peers.forEach(u=>db('/rest/v1/signals',{m:'POST',b:{call_id:c.id,to_user:u,kind:'leave',data:null}}).catch(()=>{}));callUI()}
async function checkCallEnded(){if(!call)return;try{const rows=await db(`/rest/v1/calls?select=ended_at&id=eq.${call.id}`);if(!rows.length||rows[0].ended_at){const c=call;call=null;clearInterval(callTimer);callTimer=null;Object.keys(pcs).forEach(closePc);c.stream.getTracks().forEach(t=>t.stop());c.cameraStream&&c.cameraStream.getTracks().forEach(t=>t.stop());callUI();toast('The call has ended.')}}catch{}}
function callUI(){const el=$('#call');if(!call&&!incoming){clearInterval(callTimer);callTimer=null;el.className='';el.innerHTML='';return}el.className='show';if(!call){el.innerHTML=`<div style="font-size:60px">📞</div><h2>${esc(nmOf(incoming.from))} is calling…</h2><div style="display:flex;gap:16px"><button style="background:#e5484d;padding:16px 24px" onclick="declineCall()">Decline</button><button class=join-call style="padding:16px 24px" onclick="acceptCall()">📞 Accept</button></div>`;return}const peers=call.peers.length;el.innerHTML=`<h2>Chorely call</h2><div id="call-status">${peers?peers+' other participant(s)':'Waiting for others to join…'}</div><div id="call-grid" class="call-grid"></div><div id="ct" style="font-size:24px">${fmtCallTime(Date.now()-(call.t0||Date.now()))}</div><div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button class=g onclick="muteCall()">${call.muted?'🔇 Unmute':'🎤 Mute'}</button><button class=g onclick="toggleCamera()">${call.camera?'📷 Camera off':'📷 Camera on'}</button><button style="background:#e5484d" onclick="endCall()">Hang up</button></div>`;const grid=$('#call-grid');if(call.camera){const tile=document.createElement('div');tile.id='tile-local';tile.className='call-tile';const v=document.createElement('video');v.autoplay=true;v.muted=true;v.playsInline=true;v.srcObject=call.stream;tile.appendChild(v);fitVideoToOrientation(v,tile);const cap=document.createElement('small');cap.textContent='You';tile.appendChild(cap);grid.appendChild(tile)}Object.entries(remoteStreams).forEach(([id,stream])=>ensureRemoteTile(id,stream));layoutCallGrid();clearInterval(callTimer);callTimer=setInterval(()=>{const el2=$('#ct');if(el2&&call)el2.textContent=fmtCallTime(Date.now()-(call.t0||Date.now()));else clearInterval(callTimer)},1000)}
callPoll=setInterval(()=>{pollIncomingCalls();if(call){checkCallEnded();rpc('touch_call',{p_call_id:call.id}).catch(()=>{})}},15000);
let beatT;const beat=()=>{if(S.access&&!document.hidden)rpc('touch',{}).catch(()=>{})};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.access){beat();load()}});
S.access?start():loginView();
</script></body></html>
