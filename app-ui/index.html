<!doctype html>
<html lang="en"><head><meta charset="utf-8">

<style>

#call{overflow:auto;justify-content:flex-start;padding-top:5vh}#call video{display:block;width:100%;height:100%;min-height:0;max-height:none;border-radius:14px;background:#111;object-fit:contain}.call-grid{width:min(100%,1000px);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:start}.call-tile{min-width:0;min-height:0;aspect-ratio:16/9;position:relative;background:#171a20;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;justify-content:center}.call-tile.portrait{aspect-ratio:3/4}.call-tile.landscape{aspect-ratio:16/9}.call-tile video{width:100%;height:100%;object-fit:contain}.call-tile small{display:block;flex:0 0 auto;padding:5px;color:#fff}
.join-call{background:#25c779!important;color:#062b18!important;font-weight:800}
*{box-sizing:border-box;margin:0;font-family:system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);padding:env(safe-area-inset-top) 0 150px}

button.g{background:var(--bg);color:var(--mut);border:1px solid var(--bd)}button.ic{background:none;font-size:20px;padding:6px}

.tag{display:inline-block;margin-top:8px;padding:4px 10px;border-radius:10px;font-size:12px;font-weight:600;color:#fff}.tag.later{background:var(--wa);color:#000}.tag.pending{background:var(--ac)}.tag.done{background:var(--ok);color:#000}
.act{display:flex;gap:8px;margin-top:10px}.act button{padding:7px 12px}.act .on{color:#ff5d7a;border-color:#ff5d7a}
.cms{margin-top:10px;border-top:1px solid var(--bd);padding-top:8px}.cm{font-size:14px;margin-bottom:8px}.cm small{display:inline;color:var(--mut)}.cm a{color:#ff6b6b;margin-left:6px}
.cin{display:flex;gap:6px}.cin input{margin-top:0}
.prog{margin:6px 16px}.pb{height:8px;border-radius:4px;background:var(--bd);margin-top:6px;overflow:hidden}.pb i{display:block;height:100%;background:var(--ok)}
.rk{width:36px;font-size:22px;text-align:center}.cnt{font-size:22px}
.set{margin:10px 16px;padding:14px;background:var(--card);border:1px solid var(--bd);border-radius:18px}.set h3{font-size:15px;margin-bottom:4px}.set small{color:var(--mut)}.set button{margin-top:8px;margin-right:6px}
.fab{position:fixed;right:18px;bottom:calc(80px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;font-size:30px;box-shadow:0 8px 24px #7c5cff66;z-index:3}

#nav button{flex:1;background:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:20px;padding:6px}#nav button span{font-size:11px}#nav button.on{color:var(--ac)}
input{width:100%;padding:13px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px;margin-top:10px}
.sheet{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:5}.sheet.show{display:flex}.sheet>div{background:var(--bg);width:100%;padding:20px;border-radius:24px 24px 0 0;max-height:90vh;overflow:auto}
.pk{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.pk button{background:var(--card);color:var(--tx);border:1px solid var(--bd);font-weight:500}.pk .on{background:var(--ac);color:#fff;border-color:var(--ac)}
#wal{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:6;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:8px 12px;font-weight:700;font-size:14px}#wal:empty{display:none}
.bub{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:8px 12px;margin:8px 0;max-width:85%}.bub.me{margin-left:auto;background:var(--ac);color:#fff}.bub small{display:block;font-size:11px;opacity:.7}.bub a{font-size:12px}
.pp{flex:0 0 auto;text-align:center;font-size:11px;color:var(--mut)}.pp .aw{margin:0 auto 4px}.aw{position:relative;flex:0 0 auto}.pd{position:absolute;right:0;bottom:0;width:12px;height:12px;border-radius:50%;border:2px solid var(--card);background:#8a91a0}.pd.on{background:#2fd08a}
.warn{margin:8px 16px;padding:12px;border-radius:14px;background:#e5484d22;border:1px solid #e5484d;font-size:14px}
.st{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.st div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;text-align:center;font-size:12px;color:var(--mut)}.st b{display:block;font-size:20px;color:var(--tx)}
.chk{width:30px;height:30px;border-radius:8px;border:2px solid var(--bd);background:var(--bg);color:#000;padding:0;font-size:18px;flex:0 0 auto}.chk.on{background:var(--ok);border-color:var(--ok)}
.toast{position:fixed;top:calc(60px + env(safe-area-inset-top));left:12px;right:12px;z-index:9;background:var(--tx);color:var(--bg);padding:12px;border-radius:14px;font-size:14px}.nf{padding:10px 0;border-bottom:1px solid var(--bd);font-size:14px}.nf.un{font-weight:700}
#call{position:fixed;inset:0;background:#000e;z-index:20;display:none;align-items:center;justify-content:center;flex-direction:column;color:#fff;text-align:center;gap:16px;padding:20px}#call.show{display:flex}
.login{max-width:380px;margin:10vh auto;padding:20px}.empty{text-align:center;color:var(--mut);padding:40px}#err{color:#ff6b6b;margin-top:8px;font-size:14px}#big{width:100%;border-radius:16px}
</style></head><body>
<div id="app"></div><div id="call"></div><div id="wal" onclick="walletView()"></div><nav id="nav"></nav><div class="sheet" id="sh"><div id="shc"></div></div>
<input id="f" type="file" accept="image/*" capture="environment" hidden>
<input id="fm" type="file" accept="image/*" multiple hidden>
<script src="config.js"></script>
<script>
if(!window.CFG||/YOUR/.test(CFG.url)){document.body.innerHTML='<p style="padding:30px">Open app-ui/config.js and paste your Supabase URL and key, then rebuild.</p>';throw 0}
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={};try{S=JSON.parse(localStorage.getItem('chorely2')||'{}')}catch{}
const save=()=>{try{localStorage.setItem('chorely2',JSON.stringify(S))}catch{}};
let CS={theme:'dark',h24:false,def:'pending',sec:20,wallpaper:null};try{Object.assign(CS,JSON.parse(localStorage.getItem('chorely_set')||'{}'))}catch{}
const saveCS=()=>{try{localStorage.setItem('chorely_set',JSON.stringify(CS))}catch{}document.body.classList.toggle('light',CS.theme=='light');if(CS.wallpaper)document.body.style.setProperty('--bg',CS.wallpaper);else document.body.style.removeProperty('--bg')};saveCS();
let pushTopic='',earn=[],seenN=0,notifs=[],lastUn=null,tasks=[],pend=[],tSel=new Set(),schedOn=false,W={},convs=[],lastM={},chat=null,chatMsgs=[],alertsL=[],usage=null,tab='chores',users=[],chores=[],days={},hearts={},cms={},openC={},ph={},who='',flt='all',range='today',leaders=[],mode=null,target=null,timer,newStatus='pending',newBlob=null,refreshing=null;
const local=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const add=(s,n)=>{const d=new Date(s+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
let date=local();const LBL={later:'Later',pending:'Pending',done:'Done'};
const fmt=s=>new Date(s).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit',hour12:!CS.h24});
const slug=n=>n.trim().toLowerCase().replace(/[^a-z0-9]+/g,'');
function setSession(j){if(typeof ws!='undefined'&&ws&&ws.readyState==1)ws.send(JSON.stringify({topic:'realtime:chorely',event:'access_token',payload:{access_token:j.access_token},ref:'t'}));S.access=j.access_token;S.refresh=j.refresh_token;S.exp=Date.now()+(j.expires_in-60)*1000;S.id=j.user.id;save()}
function refresh(){if(!refreshing)refreshing=(async()=>{const r=await fetch(`${CFG.url}/auth/v1/token?grant_type=refresh_token`,{method:'POST',headers:{apikey:CFG.key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:S.refresh})});if(!r.ok)throw 401;setSession(await r.json())})().finally(()=>refreshing=null);return refreshing}
async function req(path,o={}){if(S.access&&Date.now()>S.exp)await refresh();
 const go=()=>fetch(CFG.url+path,{method:o.m||'GET',headers:{apikey:CFG.key,...(S.access?{Authorization:'Bearer '+S.access}:{}),...(o.h||{})},body:o.body});
 let r=await go();if(r.status==401&&S.refresh){await refresh();r=await go()}
 if(!r.ok)throw {s:r.status,t:await r.text()};return r}
async function db(path,o={}){const r=await req(path,{m:o.m,h:{'Content-Type':'application/json',Prefer:'return=minimal',...(o.h||{})},body:o.b&&JSON.stringify(o.b)});const t=await r.text();return t?JSON.parse(t):null}
function loginView(msg=''){try{ws&&(ws.onclose=null,ws.close())}catch{}clearInterval(timer);clearInterval(beatT);$('#wal').innerHTML='';$('#nav').innerHTML='';$('#app').innerHTML=`<div class=login><h1>Chorely</h1><p style="color:var(--mut);margin-top:6px">Shared chores with photo proof</p>
<input id=nm placeholder="Your name" value="${esc(S.name||'')}" autocapitalize=words><input id=pw type=password placeholder="Password (6+ characters)">
<p id=err>${esc(msg)}</p><div style="display:flex;gap:8px;margin-top:14px"><button style="flex:1" onclick="auth('login')">Log in</button><button class=g style="flex:1" onclick="auth('register')">Create account</button></div></div>`}
async function auth(kind){const name=$('#nm').value.trim(),pw=$('#pw').value;
 if(!slug(name)||pw.length<6)return $('#err').textContent='Enter a name and a password of 6+ characters';
 try{const r=await fetch(`${CFG.url}/auth/v1/${kind=='login'?'token?grant_type=password':'signup'}`,{method:'POST',headers:{apikey:CFG.key,'Content-Type':'application/json'},body:JSON.stringify({email:slug(name)+'@chorely.app',password:pw})});
  const j=await r.json();if(!r.ok)throw {s:r.status,t:j.msg||j.error_description||j.message||''};
  if(!j.access_token)throw {s:0,t:'confirm'};
  setSession(j);
  if(kind=='register'){await db('/rest/v1/profiles',{m:'POST',b:{id:S.id,name}});S.name=name}
  else{const p=await db(`/rest/v1/profiles?select=name&id=eq.${S.id}`);S.name=(p&&p[0]&&p[0].name)||name}
  save();start()}
 catch(e){S.access=null;$('#err').textContent=e.t=='confirm'?'Turn off "Confirm email" in Supabase':/already|registered/i.test(e.t||'')?'That name is taken':e.s==400&&kind=='login'?'Wrong name or password':e instanceof TypeError?'Cannot reach the internet':'Problem: '+(e.t||e)}}
function logout(){endCall();S={name:S.name};save();ph={};users=[];tab='chores';loginView()}
let ws,wsT;
function rtConnect(){
 if(!S.access)return;
 try{if(ws){ws.onclose=null;ws.close()}}catch{}
 try{
  ws=new WebSocket(CFG.url.replace(/^http/,'ws')+'/realtime/v1/websocket?apikey='+CFG.key+'&vsn=1.0.0');
  ws.onopen=()=>{
   ws.send(JSON.stringify({topic:'realtime:chorely',event:'phx_join',ref:'1',payload:{config:{broadcast:{self:false},presence:{key:''},postgres_changes:['chores','comments','hearts','msgs','tasks','notifs','alerts','wallets','members','calls','signals','call_participants'].map(table=>({event:'*',schema:'public',table}))},access_token:S.access}}));
   clearInterval(wsT);
   wsT=setInterval(()=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify({topic:'phoenix',event:'heartbeat',payload:{},ref:'hb'}))},25000);
  };
  let t;
  ws.onmessage=e=>{
   let m;try{m=JSON.parse(e.data)}catch{return}
   if(m.event!=='postgres_changes')return;
   const d=m.payload&&m.payload.data;if(!d)return;
   if(d.table==='signals'){if(d.type==='INSERT')onSignal(d.record);return}
   if(d.table==='calls'){
    if(d.type==='INSERT')onIncoming(d.record);
    if(d.type==='UPDATE'&&call&&d.record.id===call.id&&d.record.ended_at)checkCallEnded();
   }
   if(d.table==='call_participants'&&call&&d.record.call_id===call.id){
    if(d.type==='INSERT'&&d.record.user_id!==S.id&&!call.peers.includes(d.record.user_id)){call.peers.push(d.record.user_id);callUI()}
    if(d.type==='UPDATE'&&d.record.left_at){closePc(d.record.user_id);call.peers=call.peers.filter(x=>x!==d.record.user_id);callUI()}
   }
   clearTimeout(t);t=setTimeout(load,250);
  };
  ws.onclose=()=>{clearInterval(wsT);if(S.access)setTimeout(rtConnect,5000)};
 }catch(e){setTimeout(rtConnect,5000)}
}
function start(){rtConnect();checkUpdate().then(()=>render());checkStorage();purgeTasks();load().then(()=>{handleCallRoute();pollIncomingCalls()});clearInterval(beatT);beatT=setInterval(beat,30000);beat();clearInterval(timer);timer=setInterval(()=>{if(!document.hidden)load()},CS.sec*1000)}
let busy=false,again=false;
async function load(){if(busy){again=true;return}busy=true;try{await load0()}finally{busy=false;if(again){again=false;load()}}}
async function load0(){try{
 const [u,c,d]=await Promise.all([db('/rest/v1/profiles?select=id,name,avatar_path,last_seen&order=name'),
  db(`/rest/v1/chores?select=id,title,owner,status,created_at,done_at,before_path,photo_path,credits&due_date=eq.${date}&order=created_at.desc,id.desc`),
  db(`/rest/v1/chores?select=due_date,status&due_date=gte.${add(date,-3)}&due_date=lte.${add(date,10)}`),loadExtra()]);
 const h={},m={},dy={};
 d.forEach(x=>{const k=dy[x.due_date]||(dy[x.due_date]={total:0,done:0});k.total++;if(x.status=='done')k.done++});
 if(c.length){const ids=c.map(x=>x.id).join(',');
  const [hh,mm]=await Promise.all([db(`/rest/v1/hearts?select=chore_id,user_id&chore_id=in.(${ids})`),db(`/rest/v1/comments?select=id,chore_id,author,body,created_at&chore_id=in.(${ids})&order=created_at`)]);
  hh.forEach(x=>{const k=h[x.chore_id]||(h[x.chore_id]={n:0,mine:false});k.n++;if(x.user_id==S.id)k.mine=true});
  mm.forEach(x=>(m[x.chore_id]||(m[x.chore_id]=[])).push(x))}
 users=u;chores=c;days=dy;hearts=h;cms=m;
 if(tab=='leaders')await loadLeaders();
 render()
}catch(e){if(e==401||e.s==401)logout();else if(e.s)$('#app').innerHTML='<div class=empty>Problem: '+esc(e.t||e.s)+'<br><br>Did you run ALL the .sql update files in Supabase? (update4.sql is the newest)</div>';else if(!users.length)$('#app').innerHTML='<div class=empty>Cannot reach the internet. Retrying…</div>'}}
const ld=t=>new Date(new Date(t).getTime()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
async function loadLeaders(){const d=new Date();d.setHours(0,0,0,0);if(range=='week')d.setDate(d.getDate()-6);if(range=='month')d.setDate(1);if(range=='all')d.setTime(0);
 const old=new Date();old.setDate(old.getDate()-60);
 const [r,sr]=await Promise.all([db(`/rest/v1/chores?select=owner&status=eq.done&done_at=gte.${encodeURIComponent(d.toISOString())}`),db(`/rest/v1/chores?select=owner,done_at&status=eq.done&done_at=gte.${encodeURIComponent(old.toISOString())}`)]),n={},ds={};
 r.forEach(x=>n[x.owner]=(n[x.owner]||0)+1);sr.forEach(x=>(ds[x.owner]||(ds[x.owner]=new Set())).add(ld(x.done_at)));
 const streak=id=>{const st=ds[id];if(!st)return 0;let k=0,day=local();if(!st.has(day))day=add(day,-1);while(st.has(day)){k++;day=add(day,-1)}return k};
 leaders=users.map(u=>({...u,n:n[u.id]||0,s:streak(u.id)})).sort((a,b)=>b.n-a.n||a.name.localeCompare(b.name))}
function render(){
 const ae=document.activeElement,keep=ae&&ae.tagName=='INPUT'?{id:ae.id,v:ae.value}:null,inChat=tab=='msgs'&&chat;
 if($('#sh').classList.contains('show')||(keep&&!(inChat&&keep.id=='mi')))return;
 $('#app').innerHTML=updBanner()+(tab=='chores'?vChores():tab=='msgs'?vMsgs():tab=='tasks'?vTasks():tab=='credit'?vCredit():tab=='leaders'?vLeaders():vSettings());{const un=notifs.filter(n=>!n.read).length;$('#wal').innerHTML=`<span onclick="event.stopPropagation();bellView()">🔔${un?` <b style="color:#ff5d7a">${un}</b>`:''}</span> &nbsp; 👛 ${(W[S.id]||{credits:0}).credits}`}
 $('#nav').innerHTML=[['chores','📋','Chores'],['msgs','💬','Messages'],['tasks','✅','Tasks'],['credit','👛','Credit'],['leaders','🏆','Leaders'],['settings','⚙️','Settings']].map(([t,i,l])=>`<button class="${tab==t?'on':''}" onclick="tab='${t}';load()">${i}<span>${l}</span></button>`).join('');
 loadImgs();if(keep&&keep.id=='mi'){const n=$('#mi');if(n){n.value=keep.v;n.focus()}}if(inChat&&chatMsgs.length!=seenN){seenN=chatMsgs.length;window.scrollTo(0,document.body.scrollHeight)}}
function loadImgs(){document.querySelectorAll('img[data-p]').forEach(async i=>{try{i.src=await photo(i.dataset.p)}catch{}})}
function vChores(){const t=local(),mo=new Date(date+'T12:00:00Z').toLocaleDateString([], {month:'long',year:'numeric',timeZone:'UTC'});
 const strip=Array.from({length:14},(_,i)=>add(date,i-3)).map(d=>{const x=days[d],c=!x?'':x.done==x.total?'d':'p',w=new Date(d+'T12:00:00Z').toLocaleDateString([], {weekday:'short',timeZone:'UTC'});
  return `<div class="day ${d==date?'on':''}" onclick="go('${d}')">${w}<b>${+d.slice(8)}</b><i class="dot ${c}"></i></div>`}).join('');
 const chips=[{id:'',name:'Everyone'},...users].map(u=>`<div class="chip ${who==u.id?'on':''}" onclick="who='${u.id}';render()">${esc(u.id==S.id?'Me':u.name)}</div>`).join('');
 const fl=['all','later','pending','done'].map(s=>`<div class="chip ${flt==s?'on':''}" onclick="flt='${s}';render()">${s=='all'?'All':LBL[s]}</div>`).join('');
 const tot=chores.length,dn=chores.filter(c=>c.status=='done').length;
 const prog=tot?`<div class=prog><div class=pb><i style="width:${dn/tot*100}%"></i></div><small style="color:var(--mut)">${dn} of ${tot} done</small></div>`:'';
 const cards=chores.filter(c=>(!who||c.owner==who)&&(flt=='all'||c.status==flt)).map(card).join('')||'<div class=empty>No chores here</div>';

async function flushIce(f){const pc=pcs[f];if(!pc||!pc.remoteDescription)return;for(const c of icePend[f]||[])await pc.addIceCandidate(c).catch(()=>{});icePend[f]=[]}
async function onSignal(r){
 if(!call||r.call_id!=call.id||r.from_user==S.id)return;const f=r.from_user;
 try{
  if(r.kind==='join'){
   if(!call.peers.includes(f))call.peers.push(f);
   mkPc(f);callUI();
  }else if(r.kind==='offer'){
   const pc=mkPc(f),polite=String(S.id)>String(f),collision=makingOffer[f]||pc.signalingState!=='stable';
   ignoreOffer[f]=!polite&&collision;if(ignoreOffer[f])return;
   if(collision&&polite)await pc.setLocalDescription({type:'rollback'});
   await pc.setRemoteDescription(r.data);await flushIce(f);
   await pc.setLocalDescription();sig(f,'answer',pc.localDescription.toJSON());
  }else if(r.kind==='answer'){
   const pc=pcs[f];if(pc){await pc.setRemoteDescription(r.data);await flushIce(f)}
  }else if(r.kind==='ice'){
   const pc=pcs[f];if(pc&&pc.remoteDescription)await pc.addIceCandidate(r.data).catch(()=>{});
   else(icePend[f]=icePend[f]||[]).push(r.data);
  }else if(r.kind==='leave'){
   closePc(f);call.peers=call.peers.filter(x=>x!==f);callUI();
  }else if(r.kind==='decline'){toast(nmOf(f)+' declined the call')}
 }catch(e){}
}
async function toggleCamera(){
 if(!call)return;
 try{
  if(!call.camera){
   const facing=call.cameraFacing||'user';
   let v;
   try{v=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing}},audio:false})}
   catch{v=await navigator.mediaDevices.getUserMedia({video:true,audio:false})}
   const track=v.getVideoTracks()[0];
   call.stream.addTrack(track);call.cameraStream=v;call.camera=true;
   call.cameraFacing=(track.getSettings&&track.getSettings().facingMode)||facing;
   call.cameraSwitchAvailable=true;try{call.cameraDevices=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');const current=call.cameraDevices.findIndex(d=>d.deviceId===track.getSettings().deviceId);if(current>=0)call.cameraDeviceIndex=current;}catch{}
   Object.keys(pcs).forEach(f=>{const pc=pcs[f];const sender=pc.getSenders().find(x=>x.track&&x.track.kind==='video');if(sender)sender.replaceTrack(track);else pc.addTrack(track,call.stream)});
  }else{
   call.stream.getVideoTracks().forEach(t=>{call.stream.removeTrack(t);t.stop()});
   Object.keys(pcs).forEach(f=>{const pc=pcs[f];const sender=pc.getSenders().find(x=>x.track&&x.track.kind==='video');if(sender)sender.replaceTrack(null)});
   call.cameraStream&&call.cameraStream.getTracks().forEach(t=>t.stop());call.camera=false;
  }
  callUI();
 }catch{alert('Camera permission was not granted or no camera is available.')}
}
async function switchCamera(){
 if(!call||!call.camera)return;
 let nextStream=null;
 try{
  // Figure out current facing and flip it
  const oldTrack=call.stream.getVideoTracks()[0];
  let oldFacing='user';
  try{oldFacing=(oldTrack&&oldTrack.getSettings&&oldTrack.getSettings().facingMode)||call.cameraFacing||'user'}catch{}
  if(oldFacing!=='environment'&&oldFacing!=='user')oldFacing=call.cameraFacing||'user';
  const nextFacing=oldFacing==='environment'?'user':'environment';

  // CRITICAL on phones: fully release the current camera BEFORE opening the other one.
  // Many Android/iOS browsers refuse a second camera (or keep giving front) while the first is still open.
  call.stream.getVideoTracks().forEach(t=>{
   try{call.stream.removeTrack(t)}catch{}
   try{t.stop()}catch{}
  });
  if(call.cameraStream){
   call.cameraStream.getTracks().forEach(t=>{try{t.stop()}catch{}});
   call.cameraStream=null;
  }
  // Brief pause so the OS releases the hardware
  await new Promise(r=>setTimeout(r,120));

  let lastErr=null;
  // Try opposite facingMode several ways (mobile browsers vary a lot)
  const attempts=[
   {video:{facingMode:{exact:nextFacing}},audio:false},
   {video:{facingMode:{ideal:nextFacing}},audio:false},
   {video:{facingMode:nextFacing},audio:false}
  ];
  for(const c of attempts){
   try{nextStream=await navigator.mediaDevices.getUserMedia(c);break}
   catch(e){lastErr=e}
  }

  // Fallback: enumerate cameras and pick a different deviceId
  if(!nextStream){
   const devices=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');
   if(devices.length<2)throw lastErr||new Error('Only one camera');
   const currentId=oldTrack&&oldTrack.getSettings?oldTrack.getSettings().deviceId:null;
   // Prefer a device whose label suggests the other camera
   const wantBack=nextFacing==='environment';
   let next=devices.find(d=>{
    const lab=(d.label||'').toLowerCase();
    if(wantBack)return /back|rear|environment|posterior|world/i.test(lab);
    return /front|user|face|selfie/i.test(lab);
   });
   if(!next||next.deviceId===currentId){
    const idx=Math.max(0,devices.findIndex(d=>d.deviceId===currentId));
    next=devices[(idx+1)%devices.length];
   }
   nextStream=await navigator.mediaDevices.getUserMedia({video:{deviceId:{exact:next.deviceId}},audio:false});
  }

  const newTrack=nextStream.getVideoTracks()[0];
  if(!newTrack)throw new Error('No video track');

  // Put new track into the shared call stream
  call.stream.addTrack(newTrack);
  call.cameraStream=nextStream;
  call.cameraFacing=(newTrack.getSettings&&newTrack.getSettings().facingMode)||nextFacing;
  call.camera=true;
  call.cameraSwitchAvailable=true;

  // Push new track to all peer connections
  for(const pc of Object.values(pcs)){
   const sender=pc.getSenders().find(s=>s.track&&s.track.kind==='video')
     ||pc.getSenders().find(s=>!s.track||(s.track&&s.track.kind==='video'));
   if(sender)await sender.replaceTrack(newTrack);
   else pc.addTrack(newTrack,call.stream);
  }

  // Update local preview video element immediately
  const localVid=document.querySelector('#tile-local video');
  if(localVid){
   localVid.srcObject=new MediaStream(call.stream.getVideoTracks());
   fitVideoToOrientation(localVid,document.getElementById('tile-local'));
  }

  try{
   call.cameraDevices=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');
  }catch{}

  callUI();
 }catch(e){
  if(nextStream)nextStream.getTracks().forEach(t=>{try{t.stop()}catch{}});
  console.warn('switchCamera',e);
  // Try to restore previous camera so user is not left without video
  try{
   if(call&&!call.stream.getVideoTracks().length){
    const restore=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:call.cameraFacing||'user'}},audio:false});
    const t=restore.getVideoTracks()[0];
    call.stream.addTrack(t);call.cameraStream=restore;call.camera=true;
    for(const pc of Object.values(pcs)){
     const sender=pc.getSenders().find(s=>s.track&&s.track.kind==='video')||pc.getSenders().find(s=>!s.track);
     if(sender)await sender.replaceTrack(t);else pc.addTrack(t,call.stream);
    }
    callUI();
   }
  }catch{}
  toast('Could not switch camera. Try turning camera off then on again.');
 }
}
function muteCall(){call.muted=!call.muted;call.stream.getAudioTracks().forEach(t=>t.enabled=!call.muted);callUI()}
async function endCall(){
 if(!call)return;const c=call;call=null;clearInterval(callTimer);callTimer=null;
 Object.keys(pcs).forEach(closePc);c.stream.getTracks().forEach(t=>t.stop());c.cameraStream&&c.cameraStream.getTracks().forEach(t=>t.stop());
 await rpc('leave_call',{p_call_id:c.id}).catch(()=>{});
 c.peers.forEach(u=>db('/rest/v1/signals',{m:'POST',b:{call_id:c.id,to_user:u,kind:'leave',data:null}}).catch(()=>{}));
 callUI();
}
async function checkCallEnded(){
 if(!call)return;
 try{
  const rows=await db(`/rest/v1/calls?select=ended_at&id=eq.${call.id}`);
  if(!rows.length||rows[0].ended_at){const c=call;call=null;clearInterval(callTimer);callTimer=null;Object.keys(pcs).forEach(closePc);c.stream.getTracks().forEach(t=>t.stop());c.cameraStream&&c.cameraStream.getTracks().forEach(t=>t.stop());callUI();toast('The call has ended.')}
 }catch{}
}
function callUI(){
 const el=$('#call');
 if(!call&&!incoming){clearInterval(callTimer);callTimer=null;el.className='';el.innerHTML='';return}
 el.className='show';
 if(!call){el.innerHTML=`<div style="font-size:60px">📞</div><h2>${esc(nmOf(incoming.from)==='?'?'Someone':nmOf(incoming.from))} is calling…</h2><div style="display:flex;gap:16px"><button style="background:#e5484d;padding:16px 24px" onclick="declineCall()">Decline</button><button class=join-call style="padding:16px 24px" onclick="acceptCall()">📞 Accept</button></div>`;return}
 const peers=call.peers.length,tiles=1+(Object.keys(remoteStreams).length);
 el.innerHTML=`<h2>Chorely call</h2><div id="call-status">${peers?peers+' other participant(s)':'Waiting for others to join…'}</div><div id="call-grid" class="call-grid"></div><div id="ct" style="font-size:24px">${fmtCallTime(Date.now()-(call.t0||Date.now()))}</div><div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button class=g onclick="muteCall()">${call.muted?'🔇 Unmute':'🎤 Mute'}</button><button class=g onclick="toggleCamera()">${call.camera?'📷 Camera off':'📷 Camera on'}</button>${call.camera&&call.cameraSwitchAvailable?'<button class=g onclick="switchCamera()">🔄 Switch camera</button>':''}<button style="background:#e5484d" onclick="endCall()">Hang up</button></div>`;
 const grid=$('#call-grid');
 if(call.camera){const tile=document.createElement('div');tile.id='tile-local';tile.className='call-tile';const v=document.createElement('video');v.autoplay=true;v.muted=true;v.playsInline=true;v.srcObject=call.stream;tile.appendChild(v);fitVideoToOrientation(v,tile);const cap=document.createElement('small');cap.textContent='You';tile.appendChild(cap);grid.appendChild(tile)}
 Object.entries(remoteStreams).forEach(([id,stream])=>ensureRemoteTile(id,stream));
 layoutCallGrid();
 clearInterval(callTimer);
 callTimer=setInterval(()=>{const el=$('#ct');if(el&&call)el.textContent=fmtCallTime(Date.now()-(call.t0||Date.now()));else clearInterval(callTimer)},1000);
}
callPoll=setInterval(()=>{pollIncomingCalls();checkCallEnded();if(call)rpc('touch_call',{p_call_id:call.id}).catch(()=>{})},5000);
let beatT;const beat=()=>{if(S.access&&!document.hidden)rpc('touch',{}).catch(()=>{})};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.access){beat();load()}});
S.access?start():loginView();
</script></body></html>
