name: Release APK
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (must match APP_VERSION in app-ui/index.html), e.g. 9"
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-linux-android,armv7-linux-androideabi" }
      - run: cargo install tauri-cli --version "^2" --locked
      - name: Build APK
        run: |
          export NDK_HOME=$ANDROID_NDK_LATEST_HOME
          cargo tauri icon src-tauri/app-icon.png
          cargo tauri android init
          sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA" /><uses-permission android:name="android.permission.RECORD_AUDIO" /><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n<application|' src-tauri/gen/android/app/src/main/AndroidManifest.xml
          cargo tauri android build --apk --debug --target aarch64 --target armv7
          cp "$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)" chorely.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Chorely v${{ inputs.version }}
          files: chorely.apk
