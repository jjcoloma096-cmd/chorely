name: Build APK
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - run: cargo install tauri-cli --version "^2" --locked
      - name: Build APK
        run: |
          export NDK_HOME=$ANDROID_NDK_LATEST_HOME
          cargo tauri icon src-tauri/app-icon.png
          cargo tauri android init
          sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA" />\n<application|' src-tauri/gen/android/app/src/main/AndroidManifest.xml
          cargo tauri android build --apk --debug --target aarch64
      - uses: actions/upload-artifact@v4
        with: { name: chorely-apk, path: "src-tauri/gen/android/app/build/outputs/apk/**/*.apk" }
